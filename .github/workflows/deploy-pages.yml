name: GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt laden
        uses: actions/checkout@v6

      - name: pnpm einrichten
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Öffentliche Adresse bestimmen
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
          fi
          echo "NEXT_PUBLIC_SITE_URL=${SITE_URL}" >> "$GITHUB_ENV"

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Statische Webseite bauen
        run: pnpm run build:github-pages
        env:
          GITHUB_PAGES: "true"

      - name: GitHub-Pages-Markierung ergänzen
        run: touch out/.nojekyll

      - name: Webseite für GitHub Pages bereitstellen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
